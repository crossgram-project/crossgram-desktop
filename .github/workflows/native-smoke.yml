name: Native smoke build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    name: tdesktop / Windows smoke
    runs-on: windows-latest
    steps:
      - name: Check out patcher
        uses: actions/checkout@v6
        with:
          path: patcher

      - name: Resolve latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/telegramdesktop/tdesktop/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Check out upstream
        uses: actions/checkout@v6
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
          submodules: recursive
          path: work/TBuild/source

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Read build metadata and apply features
        id: metadata
        shell: bash
        working-directory: patcher
        run: |
          yarn install --immutable
          yarn metadata --target tdesktop --brand qq --github-output
          yarn apply --target tdesktop --brand qq --root "$GITHUB_WORKSPACE/work/TBuild/source"
          git -C "$GITHUB_WORKSPACE/work/TBuild/source" diff --check

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: "14.44"
          vsversion: "18.0"

      - name: Prepare and compile
        shell: cmd
        env:
          API_ID: ${{ steps.metadata.outputs.apiId }}
          API_HASH: ${{ steps.metadata.outputs.apiHash }}
        run: |
          cd /d %GITHUB_WORKSPACE%\work\TBuild\source\Telegram
          call build\prepare\win.bat skip-release silent qt6
          if errorlevel 1 exit /b %errorlevel%
          call configure.bat qt6 "-GNinja Multi-Config" -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D CMAKE_CONFIGURATION_TYPES=Debug -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
          if errorlevel 1 exit /b %errorlevel%
          cmake --build ..\out --config Debug --target Telegram --parallel
