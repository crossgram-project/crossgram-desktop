name: Check release token

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Create and remove a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="crossgram-token-check-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Release token check" \
            --notes "Temporary CI permission check." \
            --draft
          gh release delete "$tag" --cleanup-tag --yes
