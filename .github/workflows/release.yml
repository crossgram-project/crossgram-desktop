name: Build latest releases

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        required: false
        default: all
        type: choice
        options:
          - all
          - windows-linux
          - windows
          - linux
          - macos
      target:
        description: Target to build
        required: false
        default: all
        type: choice
        options:
          - all
          - tdesktop
          - tdesktop-x64
          - ayugram
          - materialgram
      force:
        description: Rebuild releases that already exist
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.build.target }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'macos' && matrix.build.target == 'materialgram' && 'macos-15-large' || matrix.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    concurrency:
      group: release-${{ matrix.build.target }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'windows-linux' && '["windows","linux"]' || inputs.platforms == 'windows' && '["windows"]' || inputs.platforms == 'linux' && '["linux"]' || inputs.platforms == 'macos' && '["macos"]' || '["windows","linux","macos"]') }}
        build:
          - target: tdesktop
            brands: '["cross","qq","wechat","wecom","dingtalk","discord"]'
            repository: telegramdesktop/tdesktop
            vsversion: "18.0"
          - target: tdesktop-x64
            brands: '["cross"]'
            repository: TDesktop-x64/tdesktop
            vsversion: "18.0"
          - target: ayugram
            brands: '["cross"]'
            repository: AyuGram/AyuGramDesktop
            vsversion: "18.0"
          - target: materialgram
            brands: '["cross"]'
            repository: kukuruzka165/materialgram
            vsversion: "18.0"
    steps:
      - name: Check out patcher
        uses: actions/checkout@v7
        with:
          path: patcher

      - name: Resolve latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.build.repository }}
        run: |
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          safe="$(printf '%s' "$tag" | tr '/ :' '---')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "safe=$safe" >> "$GITHUB_OUTPUT"

      - name: Resolve brands to build
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: crossgram/${{ matrix.build.target }}/${{ steps.release.outputs.tag }}
          ASSET_PREFIX: crossgram-${{ matrix.build.target }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.release.outputs.safe }}
          BRANDS: ${{ matrix.build.brands }}
          TARGET_FILTER: ${{ inputs.target }}
          MATRIX_TARGET: ${{ matrix.build.target }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$TARGET_FILTER" ] && [ "$TARGET_FILTER" != all ] && [ "$TARGET_FILTER" != "$MATRIX_TARGET" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo 'brands=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=()
          while IFS= read -r brand; do
            prefix="$ASSET_PREFIX-$brand-$PLATFORM-$VERSION"
            if [ "$FORCE" = true ] || ! grep -q "^$prefix\." <<<"$assets"; then
              missing+=("$brand")
            fi
          done < <(jq -r '.[]' <<<"$BRANDS")
          if [ "${#missing[@]}" -gt 0 ]; then
            brands="$(printf '%s\n' "${missing[@]}" | jq -R . | jq -sc .)"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "brands=$brands" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo 'brands=[]' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream
        if: steps.plan.outputs.needed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.build.repository }}
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
          submodules: recursive
          path: work/TBuild/source

      - name: Set up Node.js
        if: steps.plan.outputs.needed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        if: steps.plan.outputs.needed == 'true'
        run: corepack enable

      - name: Install patcher
        if: steps.plan.outputs.needed == 'true'
        working-directory: patcher
        run: yarn install --immutable

      - name: Initialize MSVC
        if: runner.os == 'Windows' && steps.plan.outputs.needed == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: "14.44"
          vsversion: ${{ matrix.build.vsversion }}

      - name: Build, smoke test, and package Windows brands
        if: runner.os == 'Windows' && steps.plan.outputs.needed == 'true'
        shell: pwsh
        env:
          CROSSGRAM_TARGET: ${{ matrix.build.target }}
          BRANDS: ${{ steps.plan.outputs.brands }}
          VERSION: ${{ steps.release.outputs.safe }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          OVERRIDE_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          OVERRIDE_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'work/TBuild/source'
          $telegram = Join-Path $source 'Telegram'
          $patcher = Join-Path $env:GITHUB_WORKSPACE 'patcher'
          $brands = @($env:BRANDS | ConvertFrom-Json)
          $brandingPaths = @(
            'Telegram/SourceFiles/core/version.h',
            'Telegram/CMakeLists.txt',
            'Telegram/Telegram.plist',
            'Telegram/Resources/winrc',
            'Telegram/Resources/art',
            'Telegram/Telegram/Images.xcassets',
            'Telegram/Resources/qrc/telegram/telegram.qrc',
            'Telegram/SourceFiles/platform/linux/specific_linux.cpp',
            'lib/xdg'
          )
          function Get-BrandMetadata([string] $brand) {
            Push-Location $patcher
            try {
              $output = @(& yarn metadata --target $env:CROSSGRAM_TARGET --brand $brand)
              if ($LASTEXITCODE -ne 0) { throw "Could not read metadata for $brand" }
              $json = $output | Where-Object { $_ -match '^\{.*\}$' } | Select-Object -Last 1
              if (-not $json) { throw "Metadata for $brand did not contain JSON" }
              return $json | ConvertFrom-Json
            } finally {
              Pop-Location
            }
          }
          function Set-Brand([string] $brand, [bool] $reset) {
            if ($reset) {
              & git -C $source checkout -- $brandingPaths
              if ($LASTEXITCODE -ne 0) { throw "Could not reset branding files" }
            }
            Push-Location $patcher
            try {
              & yarn apply --target $env:CROSSGRAM_TARGET --brand $brand --root $source
              if ($LASTEXITCODE -ne 0) { throw "Could not apply brand $brand" }
            } finally {
              Pop-Location
            }
            & git -C $source diff --check
            if ($LASTEXITCODE -ne 0) { throw "Patch validation failed for $brand" }
          }

          $firstMetadata = Get-BrandMetadata $brands[0]
          Set-Brand $brands[0] $false
          $atlRoot = Get-ChildItem (Join-Path $env:VCINSTALLDIR 'Tools/MSVC') -Directory |
            ForEach-Object { Join-Path $_.FullName 'atlmfc' } |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'include/atlbase.h') } |
            Select-Object -Last 1
          if (-not $atlRoot) { throw 'Could not locate ATL' }
          $env:INCLUDE = "$(Join-Path $atlRoot 'include');$env:INCLUDE"
          $env:LIB = "$(Join-Path $atlRoot 'lib/x64');$env:LIB"
          Push-Location $telegram
          try {
            & .\build\prepare\win.bat silent qt6
            if ($LASTEXITCODE -ne 0) { throw 'Windows dependency preparation failed' }
          } finally {
            Pop-Location
          }

          $effectiveId = [string]$firstMetadata.apiId
          $effectiveHash = [string]$firstMetadata.apiHash
          if ($env:OVERRIDE_API_ID -or $env:OVERRIDE_API_HASH) {
            if (-not $env:OVERRIDE_API_ID -or -not $env:OVERRIDE_API_HASH) { throw 'Both API overrides are required' }
            $effectiveId = $env:OVERRIDE_API_ID
            $effectiveHash = $env:OVERRIDE_API_HASH
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          for ($index = 0; $index -lt $brands.Count; $index += 1) {
            $brand = [string]$brands[$index]
            if ($index -gt 0) { Set-Brand $brand $true }
            $metadata = Get-BrandMetadata $brand
            Push-Location $telegram
            try {
              & .\configure.bat qt6 '-GNinja Multi-Config' "-DTDESKTOP_API_ID=$effectiveId" "-DTDESKTOP_API_HASH=$effectiveHash" '-DCMAKE_CONFIGURATION_TYPES=Release' '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=' '-DCMAKE_EXE_LINKER_FLAGS=dnsapi.lib' '-DDESKTOP_APP_DISABLE_AUTOUPDATE=ON'
              if ($LASTEXITCODE -ne 0) { throw "Configure failed for $brand" }
              & cmake --build ..\out --config Release --parallel
              if ($LASTEXITCODE -ne 0) { throw "Build failed for $brand" }
            } finally {
              Pop-Location
            }

            $output = Join-Path $source 'out/Release'
            $product = Join-Path $output "$($metadata.executable).exe"
            if (-not (Test-Path -LiteralPath $product)) { throw "Missing $product" }
            $workdir = Join-Path $env:RUNNER_TEMP "crossgram-smoke-$brand"
            New-Item -ItemType Directory -Force -Path $workdir | Out-Null
            $process = Start-Process -FilePath $product -ArgumentList '-quit', '-noupdate', '-workdir', $workdir -PassThru
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              throw "$product did not exit within 60 seconds"
            }
            if ($process.ExitCode -ne 0) { throw "$product exited with code $($process.ExitCode)" }

            $files = @($product)
            $updater = Join-Path $output 'Updater.exe'
            if (Test-Path -LiteralPath $updater) { $files += $updater }
            $archive = "artifacts/crossgram-$env:CROSSGRAM_TARGET-$brand-windows-$env:VERSION.zip"
            Compress-Archive -LiteralPath $files -DestinationPath $archive -Force
            $tagFile = "artifacts/crossgram-$env:CROSSGRAM_TARGET-$brand-windows-$env:VERSION.upstream-tag"
            [IO.File]::WriteAllText($tagFile, "$env:UPSTREAM_TAG`n", [Text.UTF8Encoding]::new($false))
          }

      - name: Build, smoke test, and package Linux brands
        if: runner.os == 'Linux' && steps.plan.outputs.needed == 'true'
        env:
          TARGET: ${{ matrix.build.target }}
          BRANDS: ${{ steps.plan.outputs.brands }}
          VERSION: ${{ steps.release.outputs.safe }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          OVERRIDE_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          OVERRIDE_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          source="$GITHUB_WORKSPACE/work/TBuild/source"
          patcher="$GITHUB_WORKSPACE/patcher"
          brands=()
          while IFS= read -r brand; do brands+=("$brand"); done < <(jq -r '.[]' <<<"$BRANDS")
          branding_paths=(
            Telegram/SourceFiles/core/version.h
            Telegram/CMakeLists.txt
            Telegram/Telegram.plist
            Telegram/Resources/winrc
            Telegram/Resources/art
            Telegram/Telegram/Images.xcassets
            Telegram/Resources/qrc/telegram/telegram.qrc
            Telegram/SourceFiles/platform/linux/specific_linux.cpp
            lib/xdg
          )
          apply_brand() {
            local brand="$1"
            local reset="$2"
            if [ "$reset" = true ]; then
              git -C "$source" checkout -- "${branding_paths[@]}"
            fi
            (cd "$patcher" && yarn apply --target "$TARGET" --brand "$brand" --root "$source")
            git -C "$source" diff --check
          }
          metadata_for() {
            local output json
            output="$(cd "$patcher" && yarn metadata --target "$TARGET" --brand "$1")"
            json="$(awk '/^\{.*\}$/ { value=$0 } END { print value }' <<<"$output")"
            if [ -z "$json" ]; then
              echo "Metadata for $1 did not contain JSON" >&2
              return 1
            fi
            jq -e . >/dev/null <<<"$json"
            printf '%s\n' "$json"
          }

          first_metadata="$(metadata_for "${brands[0]}")"
          apply_brand "${brands[0]}" false
          cppgir_cmake="$source/cmake/external/glib/cppgir/CMakeLists.txt"
          if grep -q 'set(GI_IGNORE_FILE_INSTALL_DIR ${CMAKE_INSTALL_FULL_DATADIR}/${PROJECT_NAME})' "$cppgir_cmake"; then
            sed -i 's|${CMAKE_INSTALL_FULL_DATADIR}/${PROJECT_NAME}|${CMAKE_INSTALL_DATADIR}/${PROJECT_NAME}|' "$cppgir_cmake"
          fi
          cd "$source/Telegram/build/docker/centos_env"
          python3 -m pip install --user poetry
          poetry install
          generated="$(DEBUG= LTO= poetry run gen_dockerfile)"
          printf '%s\n' "$generated" > Dockerfile
          docker build -t crossgram-tdesktop-build .
          sudo apt-get update
          sudo apt-get install -y xvfb

          effective_id="$(jq -r .apiId <<<"$first_metadata")"
          effective_hash="$(jq -r .apiHash <<<"$first_metadata")"
          if [ -n "$OVERRIDE_API_ID$OVERRIDE_API_HASH" ]; then
            test -n "$OVERRIDE_API_ID" && test -n "$OVERRIDE_API_HASH"
            effective_id="$OVERRIDE_API_ID"
            effective_hash="$OVERRIDE_API_HASH"
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for index in "${!brands[@]}"; do
            brand="${brands[$index]}"
            if [ "$index" -gt 0 ]; then apply_brand "$brand" true; fi
            metadata="$(metadata_for "$brand")"
            product="$(jq -r .executable <<<"$metadata")"
            cd "$source"
            docker run --rm \
              -u "$(id -u)" \
              -w /usr/src/tdesktop \
              -v "$PWD:/usr/src/tdesktop" \
              -e CONFIG=Release \
              crossgram-tdesktop-build \
              /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -Wno-error=policy \
              -Wno-error=install-absolute-destination \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D "TDESKTOP_API_ID=$effective_id" \
              -D "TDESKTOP_API_HASH=$effective_hash"

            binary="$source/out/Release/$product"
            test -x "$binary"
            workdir="$(mktemp -d)"
            timeout 60s xvfb-run -a "$binary" -quit -noupdate -workdir "$workdir"
            rm -rf "$workdir"

            package="$GITHUB_WORKSPACE/artifacts/package"
            rm -rf "$package"
            mkdir -p "$package"
            cp "$binary" "$package/"
            test ! -f "$source/out/Release/Updater" || cp "$source/out/Release/Updater" "$package/"
            archive="$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-linux-$VERSION.tar.xz"
            tar -C "$package" -cJf "$archive" .
            printf '%s\n' "$UPSTREAM_TAG" > "$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-linux-$VERSION.upstream-tag"
          done

      - name: Build, smoke test, and package macOS brands
        if: runner.os == 'macOS' && steps.plan.outputs.needed == 'true'
        env:
          TARGET: ${{ matrix.build.target }}
          BRANDS: ${{ steps.plan.outputs.brands }}
          VERSION: ${{ steps.release.outputs.safe }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          OVERRIDE_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          OVERRIDE_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          source="$GITHUB_WORKSPACE/work/TBuild/source"
          patcher="$GITHUB_WORKSPACE/patcher"
          brands=()
          while IFS= read -r brand; do brands+=("$brand"); done < <(jq -r '.[]' <<<"$BRANDS")
          branding_paths=(
            Telegram/SourceFiles/core/version.h
            Telegram/CMakeLists.txt
            Telegram/Telegram.plist
            Telegram/Resources/winrc
            Telegram/Resources/art
            Telegram/Telegram/Images.xcassets
            Telegram/Resources/qrc/telegram/telegram.qrc
            Telegram/SourceFiles/platform/linux/specific_linux.cpp
            lib/xdg
          )
          apply_brand() {
            local brand="$1"
            local reset="$2"
            if [ "$reset" = true ]; then
              git -C "$source" checkout -- "${branding_paths[@]}"
            fi
            (cd "$patcher" && yarn apply --target "$TARGET" --brand "$brand" --root "$source")
            git -C "$source" diff --check
          }
          metadata_for() {
            local output json
            output="$(cd "$patcher" && yarn metadata --target "$TARGET" --brand "$1")"
            json="$(awk '/^\{.*\}$/ { value=$0 } END { print value }' <<<"$output")"
            if [ -z "$json" ]; then
              echo "Metadata for $1 did not contain JSON" >&2
              return 1
            fi
            jq -e . >/dev/null <<<"$json"
            printf '%s\n' "$json"
          }

          first_metadata="$(metadata_for "${brands[0]}")"
          apply_brand "${brands[0]}" false
          brew install automake libtool meson nasm ninja pkg-config
          effective_id="$(jq -r .apiId <<<"$first_metadata")"
          effective_hash="$(jq -r .apiHash <<<"$first_metadata")"
          if [ -n "$OVERRIDE_API_ID$OVERRIDE_API_HASH" ]; then
            test -n "$OVERRIDE_API_ID" && test -n "$OVERRIDE_API_HASH"
            effective_id="$OVERRIDE_API_ID"
            effective_hash="$OVERRIDE_API_HASH"
          fi
          cd "$GITHUB_WORKSPACE/work/TBuild"
          ./source/Telegram/build/prepare/mac.sh silent
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for index in "${!brands[@]}"; do
            brand="${brands[$index]}"
            if [ "$index" -gt 0 ]; then apply_brand "$brand" true; fi
            metadata="$(metadata_for "$brand")"
            executable="$(jq -r .executable <<<"$metadata")"
            cd "$source/Telegram"
            ./configure.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D "TDESKTOP_API_ID=$effective_id" \
              -D "TDESKTOP_API_HASH=$effective_hash"
            cmake --build ../out --config Release --parallel

            app="$source/out/Release/$executable.app"
            product="$app/Contents/MacOS/$executable"
            test -x "$product"
            workdir="$(mktemp -d)"
            "$product" -quit -noupdate -workdir "$workdir" &
            pid=$!
            exited=false
            for _ in {1..60}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"
                exited=true
                break
              fi
              sleep 1
            done
            rm -rf "$workdir"
            if [ "$exited" != true ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "$product did not exit within 60 seconds" >&2
              exit 1
            fi

            archive="$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-macos-$VERSION.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
            printf '%s\n' "$UPSTREAM_TAG" > "$GITHUB_WORKSPACE/artifacts/crossgram-$TARGET-$brand-macos-$VERSION.upstream-tag"
          done

      - name: Upload artifact
        if: always() && steps.plan.outputs.needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: crossgram-${{ matrix.build.target }}--${{ matrix.platform }}--${{ steps.release.outputs.safe }}
          path: artifacts/crossgram-*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish ${{ matrix.build.target }}
    if: always()
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - target: tdesktop
            repository: telegramdesktop/tdesktop
          - target: tdesktop-x64
            repository: TDesktop-x64/tdesktop
          - target: ayugram
            repository: AyuGram/AyuGramDesktop
          - target: materialgram
            repository: kukuruzka165/materialgram
    steps:
      - name: Download successful platform builds
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: crossgram-${{ matrix.build.target }}--*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.build.target }}
          UPSTREAM: ${{ matrix.build.repository }}
        run: |
          if [ ! -d artifacts ]; then
            echo "No new variant artifacts for this target."
            exit 0
          fi
          mapfile -t metadata < <(find artifacts -maxdepth 1 -type f -name '*.upstream-tag' -print)
          if [ "${#metadata[@]}" -eq 0 ]; then
            echo "No release metadata for this target." >&2
            exit 1
          fi
          mapfile -t tags < <(cat "${metadata[@]}" | sed '/^$/d' | sort -u)
          if [ "${#tags[@]}" -ne 1 ]; then
            printf 'Expected one upstream tag, found: %s\n' "${tags[*]}" >&2
            exit 1
          fi
          upstream_tag="${tags[0]}"
          release_tag="crossgram/$TARGET/$upstream_tag"
          release_name="$TARGET / $upstream_tag"
          mapfile -t files < <(find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.xz' \) -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No new variant artifacts for this target."
            exit 0
          fi
          notes="Unofficial Crossgram variants patched from $UPSTREAM release $upstream_tag. All available brands and platforms for this upstream version are published together. Themed builds are not affiliated with or endorsed by the owner of the referenced application name or icon."
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${files[@]}" --clobber
          else
            gh release create "$release_tag" "${files[@]}" --title "$release_name" --notes "$notes"
          fi
